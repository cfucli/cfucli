# Proves cfucli builds from public repositories alone: a clean runner has nothing in ~/.m2, so any
# dependency or plugin that exists only on a developer's machine fails here. Builds the jars and
# the jr launchers (cfucli.exe on Windows, the macOS binaries on the Mac), publishes nothing and
# needs no secrets. Releases are still made by release.ps1.
name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      fresh_exe_from:
        description: a release tag whose cfucli.exe the fresh-profile install uses (empty for the one just built)
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: build every module
        run: mvn -B -ntp -DskipTests install
      - name: build cfucli.exe (jr-maven-plugin)
        run: mvn -B -ntp -DskipTests -Djrexe -pl bundle verify
      - name: check cfucli.exe
        shell: bash
        run: |
          test -s bundle/target/jr/cfucli.exe
          ls -l bundle/target/jr/cfucli.exe
      - name: install on a fresh profile
        # A profile nothing has installed into has no %LOCALAPPDATA%\Programs. jr-apputils 1.0 then failed with
        # SHGetKnownFolderPath(...) failed: 0x80070002, and cfucli 0.5.0 carried a workaround; 1.1 creates the
        # folder itself. The runner is throwaway, so this is a real install: default folder, PATH, shortcuts.
        # fresh_exe_from (workflow_dispatch) runs the same check on an older release's cfucli.exe instead.
        shell: cmd
        env:
          FROM: ${{ inputs.fresh_exe_from }}
        run: |
          set "EXE=%GITHUB_WORKSPACE%\bundle\target\jr\cfucli.exe"
          if not "%FROM%"=="" (
            curl.exe -fsSLo "%RUNNER_TEMP%\cfucli.exe" https://github.com/cfucli/cfucli/releases/download/%FROM%/cfucli.exe || exit /b 1
            set "EXE=%RUNNER_TEMP%\cfucli.exe"
          )
          if exist "%LOCALAPPDATA%\Programs" rmdir /s /q "%LOCALAPPDATA%\Programs"
          if exist "%LOCALAPPDATA%\Programs" (echo could not remove %LOCALAPPDATA%\Programs & exit /b 1)
          call "%EXE%" -V || exit /b 1
          call "%EXE%" -Xjr:yes install < nul || exit /b 1
          "%LOCALAPPDATA%\Programs\cfucli\cfucli.exe" -V || exit /b 1

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: build every module
        run: mvn -B -ntp -DskipTests install
      - name: build the Mac jars and binaries (jr-maven-plugin)
        # Both jars first, as release.ps1 does: each plugin run lists them in its release folder.
        run: |
          mvn -B -ntp -DskipTests -Pmac-aarch64 -pl bundle package
          mvn -B -ntp -DskipTests -Pmac -pl bundle package
          mvn -B -ntp -DskipTests -Pmac-aarch64 -Djrexe -Djr.source=url -pl bundle verify
          mkdir -p out && cp bundle/target/jr/release/cfucli-macos-arm64 out/
          mvn -B -ntp -DskipTests -Pmac -Djrexe -Djr.source=url -pl bundle verify
          cp bundle/target/jr/release/cfucli-macos-x86_64 out/
      - name: check the binaries
        run: |
          ls -l out
          file out/*
          test -s out/cfucli-macos-arm64
          test -s out/cfucli-macos-x86_64
