# Overrides the arcadedb-log.properties bundled inside arcadedb-engine.
#
# The upstream default is:
#     handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
#     java.util.logging.FileHandler.pattern = ./log/arcadedb.log
#
# "./log" is relative to the WORKING DIRECTORY, not to the app's home, so every ArcadeDB process
# drops a log/ folder wherever it happened to be launched from. For a CLI launched from anywhere,
# that means a log/ folder in whatever directory the user was standing in. That is how the code tree
# accumulated ~31 stray log/ directories full of arcadedb.log.N files.
#
# DefaultLogger.findConfiguredFileHandlerPattern() looks for this file as a classpath resource before
# falling back to the engine's copy, and with no FileHandler configured it never creates the
# directory at all. The pom also excludes the engine's copy from the shaded jar, so only this file
# can win regardless of jar ordering.
#
# The two-line summary: ship this file so no FileHandler is configured, and exclude the engine copy
# from your shaded jar so classpath order cannot decide which one wins.

handlers = java.util.logging.ConsoleHandler

.level = WARNING
com.arcadedb.level = WARNING
com.arcadedb.script.GraalPolyglotEngine.level = OFF
io.undertow.level = SEVERE
org.xnio.level = SEVERE
org.jboss.level = SEVERE

java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
